name: openidconnect_flutter_android
description: Android implementation for OpenIdConnect.
version: 3.1.0
homepage: https://github.com/4D-Technologies/openidconnect_flutter/tree/main/openidconnect_flutter_android

resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  openidconnect_platform_interface: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: openidconnect
    platforms:
      android:
        package: io.concerti.openidconnect_android
        pluginClass: OpenIdConnectAndroidPlugin
        dartPluginClass: OpenIdConnectAndroid
        fileName: openidconnect_flutter_android.dart
