name: openidconnect_flutter_linux
description: Linux implementation for OpenIdConnect.
version: 2.0.4
homepage: https://github.com/4D-Technologies/openidconnect_flutter/tree/main/openidconnect_flutter_linux

resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  openidconnect_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: openidconnect
    platforms:
      linux:
        pluginClass: OpenidconnectFlutterLinuxPlugin
        dartPluginClass: OpenIdConnectLinux
        fileName: openidconnect_flutter_linux.dart
