name: openidconnect
description: OpenIdConnect library for flutter.
version: 3.1.0
homepage: https://github.com/4D-Technologies/openidconnect_flutter

resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  openidconnect_flutter_android: ^2.0.5
  openidconnect_flutter_darwin: ^2.0.3
  openidconnect_flutter_linux: ^2.0.4
  openidconnect_platform_interface: ^2.0.4
  openidconnect_web: ^2.0.3
  openidconnect_windows: ^2.0.4
  crypto: ">=3.0.0 <4.0.0"
  url_launcher: ">=6.3.0 <7.0.0"
  http: ">=1.0.0 <2.0.0"
  retry: ">=3.1.2 <4.0.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mockito: ^5.4.5
  plugin_platform_interface: ^2.1.8

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:
  plugin:
    platforms:
      android:
        default_package: openidconnect_flutter_android
      ios:
        default_package: openidconnect_flutter_darwin
      macos:
        default_package: openidconnect_flutter_darwin
      linux:
        default_package: openidconnect_flutter_linux
      web:
        default_package: openidconnect_web
      windows:
        default_package: openidconnect_windows
