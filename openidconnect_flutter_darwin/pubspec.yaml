name: openidconnect_flutter_darwin
description: Darwin implementation for OpenIdConnect.
version: 3.1.0
homepage: https://github.com/4D-Technologies/openidconnect_flutter/tree/main/openidconnect_flutter_darwin

resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  openidconnect_platform_interface: ^3.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    implements: openidconnect
    platforms:
      ios:
        sharedDarwinSource: true
        pluginClass: OpenIdConnectDarwinPlugin
        dartPluginClass: OpenIdConnectDarwin
        fileName: openidconnect_flutter_darwin.dart
      macos:
        sharedDarwinSource: true
        pluginClass: OpenIdConnectDarwinPlugin
        dartPluginClass: OpenIdConnectDarwin
        fileName: openidconnect_flutter_darwin.dart
